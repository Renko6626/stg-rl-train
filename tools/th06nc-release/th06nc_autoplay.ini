; TH06NC AI 代打。修改后重启游戏生效，请和 DLL 一起安装。
[autoplay]
policy = onnx
model = model.onnx

; 0 手动，1 自由躲弹，2 追敌躲弹（Boss 优先）。游戏中按 C 轮换。
start_mode = 0
toggle_vk = 67
mouse_anchor = 1
safety_net = 1
show_text = 1

; 保留训练对应的方向与低速限制，以及原有激光处理。
motor = -1
motor_slow = -1
vo_laser_frames = 8

; 其余参数沿用插件默认值。设为 0 可停止定期状态日志，初始化和错误仍会记录。
log_every = 60
