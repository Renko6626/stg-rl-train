[project]
name = "stgtrain"
version = "0.1.0"
description = "stg-engine 躲弹小模型训练仓（PPO，LeanRL 底本）"
requires-python = ">=3.12,<3.13"
dependencies = [
  "stg-rl @ https://github.com/Renko6626/stg-engine/releases/download/rl-v0.1.0/stg_rl-0.1.0-cp310-abi3-manylinux_2_28_x86_64.whl",
  "stgagent @ git+https://github.com/Renko6626/stg-agent-proto@v0.1.0",
  "torch==2.14.0",
  "tensordict==0.14.2",
  "numpy",
  "matplotlib",
  "psutil",
  "nvidia-ml-py",
  "tensorboard",
]

[dependency-groups]
dev = [
    "onnx>=1.22.0",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/stgtrain", "src/stgtranscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:CUDA initialization:UserWarning",
  "ignore:.*NVIDIA driver on your system is too old.*:UserWarning",
]
