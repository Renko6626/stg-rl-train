# 激光留出评测（2026-09-26，T1 起用）= eval/splits.toml 的 10 张 + 3 张原作激光卡。
#
# 为什么另起一份：主划分是历次实验共用的尺子，加卡会改 overall 与 best.pt 的挑选口径；激光实验（T0 / T1 / 之后的 T2）
# 统一用这一份，彼此可比；与更早的实验比，看前 10 张的逐卡 / by_rank 数字。
# 3 张激光卡的选法（11 张原作激光卡里留 3、训练 8）：
#   th06_s4_w16  道中竖激光柱 —— 训练里有同形的 w15，测「见过的形态换个排布」
#   th06_s4_b12  水符「ベリーインレイク」—— 形态在训练里没有同款，测真正的泛化
#   th06_s1_b3   露米娅非符 2，长预警（120 帧）的静止激光 + 弹
# 练习卡（docs/2026-09-26-laser-practice-cards-design.md）只进训练，不进这里。
#
# ---- 以下为 eval/splits.toml 原文 ----

# 评测卡划分（spec §6）：这里列出的是留出卡，训练卡 = cards/ 下其余的卡。
#
# 2026-09-18 重建（第二版）。原则：
#   1. **必须有弹幕**——第一版按标签挑，漏看实际弹量，th06_s1_w03 / th06_s2_w06 在 rank 2 下峰值为 0
#      （前者发弹带 !L 粘滞前缀只在 Lunatic 生效，后者是只有体碰的「妖精雨」），等于两张白送的满分卡。
#   2. **按弹量分层**：稀 / 中 / 密都要有。第一版 9 张全是「中」，测不到高密度表现（全池最密的
#      s3_b2 均值 499、s3_mb3 396 当时都在训练池里）。弹量画像见 cards/density.json（`pipeline density`）。
#   3. 每关都有道中与 boss（含符卡）；标签覆盖 aimed/stream/ring/curve/spiral/random/fast/mixed。
#   4. 训练侧每个标签至少保留一张。
#
# 2026-09-19 第三版：**每张卡加 rank 3**（10 张全都有 3 档）。理由是 rank 2 已经在见顶——
# G0/H/I 三条里 s1_w04 / s2_w08 三家都是 1.00，s3_b5 / s3_mb3 / s3_b7 也有两家顶格，
# 十张里有效区分度基本只剩 s1_b4（0.72–0.94）与 s2_b6（0.78–0.94）两张。rank 3 的弹量跳得很凶
# （s1_b4 187→360、s2_b6 385→639、s3_w02 495→768），能把天花板顶开。
# 训练用的是 rank 2（E/N 专属卡钳到 1），所以 rank 3 测的是**对未见难度的泛化**。
#
# 实测（H 的 best.pt，20 组 × 32 局，CPU）证明 rank 3 选对了难度而不是地板：
#   r2 撑过 0.934 · r3 撑过 0.844（平均落差 −9.1pp，10 张里 7 张明显下掉，最大 s2_mb1 −0.19）
#   r3 上只剩 2/10 顶格（r2 是 4–5 张）⇒ 天花板顶开了，混合口径挑 best.pt 没问题。
#   旁证：r3 上抖得更凶（方向 9.99 vs 8.72/s、连击 51.2% vs 47.6%、<12px 29.7% vs 21.4%），
#   与「卡池变难 → G0 比 F 抖」同源 —— 抖动强度由弹幕密度驱动，不是模型固有属性。
#
# ⚠ 可比性：`overall` 现在是 r2+r3 混合（H 的 best 在此口径下是 0.889，而它的 r2 是 0.934）——
# **看到 0.88–0.90 不要误读成退步，那是换了尺子**。与 A–I 比要对 **`by_rank.r2`**（日志 eval/r2/*），
# r3 的历史基线是 H best 的 0.844。与 2026-09-17 的实验 A–F 更是不可比（那批含 2 张无弹卡且没有密档）。

[[eval]]
card = "th06_s1_w04"     # 第 1 关 道中 · 稀 · 峰值 96 / 场上均值 56
ranks = [2, 3]
episodes = 32

