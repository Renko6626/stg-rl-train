# 分层原则：每关都有道中和 boss（含符卡）；弹幕标签覆盖 aimed/stream/ring/curve/spiral/random/fast/mixed；
#   训练侧保留每个标签至少一张（spiral: s3_b1/b2/mb3，dense: s2_b6/s3_b8）。
# 2026-09-18 修正：原先只按标签挑，漏看实际弹量——th06_s1_w03 与 th06_s2_w06 在 rank 2 下**一颗弹都不发**
