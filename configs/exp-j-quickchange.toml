# 实验 J（2026-09-19）：I2 + **只罚亚人类延迟的回抽**。与 I2 只差 reward.terms.quick_change。
#
# 问题：`key_press` 是无差别惩罚，压的是水平不是形状。D→E→F 一路加码，边际在变差，
# 而且会把有用的移动一起压掉。实测（评测集，同尺 CPU）三条 run 的形状：
#
#             方向/s   连击(≤2帧)   临危/s   平时/s
#   F          7.54      43.1%      10.13    4.76
#   G0         9.35      46.5%      14.04    5.06
#   H          8.72      47.6%      11.80    5.43
#   I（GPU）   5.99      41.8%       8.23    3.28
#
# 也就是说：**四成以上的变向发生在上一次变向后 ≤2 帧**（60Hz 下 ≤33ms）。那不是反应，是振荡。
# 人在躲弹时一个方向至少按住 5–10 帧；连着两三帧来回翻是键盘做得到、人做不到的事。
#
# 做法：新 reward 项 `quick_change`，只在「上一个方向保持 ≤ reward.quick_frames 步就又换」时扣分，
# 阈值取 **3 帧（50ms）** —— 比先前量指标用的 2 帧更严一档（用户 2026-09-19 拍板）。
# 阈值之外的变向一分不扣，所以它不压制正常走位，只掐振荡。
#
# 系数 −0.01 的量级：I 的方向 5.99/s、连击约四成 ⇒ 约 2.5–3.5 次/s 会被罚到，合计约 −0.03/s，
# 与 `key_press` 现在的 −0.003 × 15–20 次/s ≈ −0.05/s 同量级，而 hold 的收入是 +0.6/s。
# 先按这个跑；若连击占比没动，下一轮按 F 的经验直接 ×3（那次 −0.001 → −0.003 才见效）。
#
# 判据：① `quick_frac`（≤2 帧，与历史同口径）与新加的 `quick3_frac` 是否明显下降；
# ② 撑过（`by_rank.r2`）不能掉 —— 掉了说明把有用的急闪也罚掉了；
# ③ 方向/s 与临危倍数的变化：理想是「总量不怎么降、但连击那部分被挤掉」。
[run]
total_updates = 3500
ckpt_every = 100
eval_every = 250

[env]
num_envs = 4096
threads = 63

[intent]
name = "mixed_v1"

[reward.terms]
death = 10.0
follow_shaping = 1.0
hold = 0.01
segment_survived = 0.0
key_press = -0.003
quick_change = -0.01
shift_toggle = 0.0
edge_hug = 0.0
