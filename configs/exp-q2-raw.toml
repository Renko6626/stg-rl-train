# 实验 Q2（2026-09-25）：Q1 + **去掉 d / t**（danger_topk_v6，frame = "static"，dt = false）
#
# 问题：评测时把 d / t 清零，M 从 0.82 / 0.64 掉到 0.21 / 0.08——那只说明已训好的模型依赖它；「不给 d / t 从头训」从没做过。
# Q2 删掉 d / t 两列（弹 7 → 5 维、敌 8 → 6 维），按当前边缘距离取最近 64 颗弹 / 8 个敌、不设距离上限。与 Q1 只差这一个开关。
#
# 判读：2σ 内追平 Q1 ⇒ 现有结构能从原始量学会这部分几何，动作 query 用纯原始 token；
# 明显落后 ⇒ 分「慢」还是「学不会」（u3500 是否仍在涨、u1000–3500 斜率与 Q1 比）。
[run]
