# 实验 R1c（2026-09-25）：R1a + **密度图卷积留 fp32**（model.density_fp32 = true）—— R2 的对照
#
# density_fp32 只把密度图那一小段的精度提回 fp32（bf16 下卷积的权重梯度反而更慢，编译模式下每 minibatch −8%），
# 不改结构。与 R1a 只差这一处；R2 与它同批、只差动作 query。
[run]
total_updates = 3500
ckpt_every = 100
eval_every = 250

[env]
num_envs = 4096
threads = 0

[intent]
name = "mixed_v1"

[featurize]
name = "danger_topk_v6"
frame = "static"
dt = false

[motor]
enabled = true
hold = [2, 6]
delay = [0, 2]
slow = true

[reward.terms]
death = 10.0
follow_shaping = 1.0
hold = 0.01
segment_survived = 0.0
key_press = -0.003
quick_change = -0.01
shift_toggle = 0.0
edge_hug = -0.02

[model]
name = "set_attn_v1"
sa_layers = 1
density_fp32 = true

[ppo]
amp = "bf16"
