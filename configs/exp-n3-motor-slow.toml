# 实验 N3（2026-09-20）：N2 + **低速键也过手部运动层**
#
# 问题：N1 / N2 只锁方向、低速键直通，模型学会了靠高速 4.5 / 低速 2 px 来回切找回细操作 ——
# shift 切换 2.6 次/s，是 J（0.66）的 4 倍；关掉运动层它照样这么切，已是学到的习惯。
# 所以 N2 的 0.819 / 0.644 是**带着漏洞**的成绩。
#
# 与 N2 只差两处、是一个改动的两半：motor.slow = true（低速位走同一套规则的另一路状态机，与方向互不牵连 ——
# 按 shift 的手指和按方向的手指是两根；参数与方向共用 hold U{2..6} / delay U{0..2}）+ 特征化 v5
# （v4 +「当前低速位已执行几帧」，否则状态不满足马尔可夫性）。
# 不是禁掉低速：按住低速微调本来就是人的打法，禁的只是「切得太快、太精确」。
#
# 判读（立项时定，详见 docs/experiments.md「下一批：N3 ‖ M」）：
#   ① shift_toggles_per_s 降到 ≤ 1.0（J 0.66、N2 2.58）；
#   ② 带运动层的 r2 / r3 相对 N2（0.819 / 0.644）掉多少 = 「漏洞值多少」；
#   ③ 自由档（--intent follow_player_v1）仍 ≥ 0.90 / 0.80（N2：0.944 / 0.853），否则部署价值受损，回头放宽低速键的 hold。
# 例行探针：--motor off、--motor "hold=3,7;delay=0,4;slow=1"、--intent fixed_point_v1 / follow_player_v1。
[run]
total_updates = 3500
ckpt_every = 100
eval_every = 250

[env]
num_envs = 4096
threads = 63

[intent]
name = "mixed_v1"

[featurize]
name = "danger_topk_v5"

[motor]
enabled = true
hold = [2, 6]
delay = [0, 2]
slow = true

[reward.terms]
death = 10.0
follow_shaping = 1.0
hold = 0.01
segment_survived = 0.0
key_press = -0.003
quick_change = -0.01
shift_toggle = 0.0
edge_hug = 0.0
