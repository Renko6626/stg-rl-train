# 实验 I2（2026-09-19）：**H + I 叠加 + 加长训练**。父 = H（课程已转默认），改两处：
#   · intent.name = mixed_v1（实验 I 的混合意图，跟点 60 / 锚点 30 / 自由 10）
#   · total_updates 2000 → 3500
#
# 为什么破一次「一次只改一个变量」：H 与 I 各自相对 G0 的效果已经单独量过，且**互不相干**
# （一个改采样分布、一个改意图分布），叠加只是取两者的并集，不是新假设：
#   H：撑过 0.912 → 0.950（GPU 末次）/ 0.919 → 0.934（CPU best），增益全在难卡
#   I：撑过 0.912 → 0.934，方向 8.82 → 5.99（−32%，十张卡无一例外），跟点率反而最高
# 加长的依据是 H 的评测曲线到 u2000 仍在单调爬（…0.928 → 0.934 → 0.956 → 0.950），
# 而 G0 从 u1400 起就在平台震荡 —— 这笔头寸比再调课程参数大。3500 轮约 3h40。
#
# 评测集第三版（同刀）：10 张卡各加 rank 3，20 组 × 32 局。rank 2 已经在见顶
# （G0/H/I 三条里 5 张卡顶格或近顶），而训练只用 rank 2 ⇒ rank 3 测的是对未见难度的泛化。
# **回看历史实验要对 `by_rank.r2`（日志 eval/r2/*），`overall` 已换口径。**
#
# 判据：① by_rank.r2 撑过是否 ≥ H 的 0.950；② 方向 / 连击是否保住 I 的水平（5.99 / 41.8%）；
# ③ r3 撑过作为新的头顶空间基线；④ 曲线在 u3500 前是否终于走平。
[run]
total_updates = 3500
ckpt_every = 100
eval_every = 250

[env]
num_envs = 4096
threads = 63           # run-night.sh / run-exp.sh 会按机器改写

[intent]
name = "mixed_v1"

[reward.terms]
death = 10.0
follow_shaping = 1.0
hold = 0.01
segment_survived = 0.0
key_press = -0.003
shift_toggle = 0.0
edge_hug = 0.0
