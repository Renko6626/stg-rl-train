# 实验 N2（2026-09-20）：N1 + **起手时机散布**
#
# 问题：J 的活命建立在精确到帧的操作上 —— 不重训、只在执行层加「换方向后至少保持 3 帧」，
# r2 0.919 → 0.628、r3 0.847 → 0.331；平均 1 帧的时机散布就让 r2 减半；四分之一的移动是 ≤2 帧的点按。
# D → F → J 的惩罚路线到不了这里：一次救命点按值 10（免死）、价钱 0.01，惩罚改得了习惯、去不掉能力。
# 要去掉能力，得让环境里根本做不出来 ⇒ 手部运动层（envwrap.MotorLayer）。
#
# 约束必须**随机且对模型不可见**（用户 09-20 指出）：确定性的「至少 N 帧」只是把时间轴量化成 N 帧一格，
# 模型照样能在粗格子上稳如老狗。人手的限制是结果不可控 —— 想点一下，出来 2 帧还是 6 帧自己说了不算。
#
# 与 N1 只差 motor.delay：想换方向时，延迟 U{0..2} 帧（均值 17 ms）才生效；期间改主意重抽、改回去则撤销。
# 这建模的是**时机散布**，不是反应延迟（那是「观测延迟」，另立）。
# 拆成 N1 / N2 是因为诊断里这两种约束各自都能让 J 崩，不拆分不清是谁在起作用。
#
# 判读（立项时定，详见 docs/experiments.md「N1 / N2 手部运动层」）：
#   ① 带运动层评测的撑过（末 4 次均值）。对照线是 **J 在同一运动层下**的成绩，不是 J 的 0.92。
#      成功 = r2 ≥ 0.85 且 r3 ≥ 0.70；r2 < 0.75 ⇒ 太凶，放宽 hold 重跑，不硬加轮数。
#   ② 余量有没有自己长出来：close12_frac（J：r2 22% / r3 30%）、close4_frac、擦弹/s 应明显下降。
#   ③ 加码探针（eval_ckpt --motor "hold=3,7;delay=0,4"）下平缓退化，而不是像 J 那样崩。
#   ④ 关掉运动层（--motor off）不应更差。
#   ⑤ shift_toggles_per_s（J：r2 0.66 / r3 1.05）明显上升 = 在钻「低速键不过运动层」的漏洞。
# 轮数与父实验 J 一致（3500）：保持单变量；而且运动层下的学习问题比 J 难，先不在预算上省。
# （09-20 讨论过砍到 2000：I2 的 3500 轮在 r2 上确实没比 H 的 2000 轮多买到东西，但那是没有运动层时的结论。）
[run]
total_updates = 3500
ckpt_every = 100
eval_every = 250

[env]
num_envs = 4096
threads = 63

[intent]
name = "mixed_v1"

[featurize]
name = "danger_topk_v4"

[motor]
enabled = true
hold = [2, 6]
delay = [0, 2]

[reward.terms]
death = 10.0
follow_shaping = 1.0
hold = 0.01
segment_survived = 0.0
key_press = -0.003
quick_change = -0.01
shift_toggle = 0.0
edge_hug = 0.0
