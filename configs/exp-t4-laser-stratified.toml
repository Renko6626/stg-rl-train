# T4：固定 T2-30 卡池与预算，只在激光组内部按难度分层采样。
# 激光总体采样占比保持为卡池占比；课程每 250 updates 更新并记录一次。
[run]
total_updates = 3500
ckpt_every = 100
eval_every = 250

[env]
cards_dir = ["cards", "cards-synthetic"]
eval_splits = "eval/splits-laser.toml"
num_envs = 4096
hit_extra = [0.0, 2.0]
threads = 0

[curriculum]
interval = 250
laser_stratified = true

[intent]
name = "mixed_v1"

[intent.mix]
follow = 0.6
anchor = 0.3
free = 0.1

[featurize]
name = "danger_topk_v7"
frame = "static"
dt = false
k_lasers = 16
laser_local = false

[motor]
enabled = true
hold = [2, 6]
delay = [0, 2]
slow = true

[reward.terms]
death = 10.0
follow_shaping = 1.0
hold = 0.01
segment_survived = 0.0
key_press = -0.003
quick_change = -0.01
shift_toggle = 0.0
edge_hug = -0.02

[model]
name = "set_attn_v2"
sa_layers = 1
laser_sa_layers = 0
density_fp32 = true

[ppo]
amp = "bf16"
