# 实验 G0（2026-09-19）：**新卡池基线**。配置 = 实验 F（key_press -0.003），只是跑在现在的卡池上。
#
# 为什么 F 不能直接当基线：F 收工时卡池 45 张（TH06 1–3 关），现在 84 张（+5–6 关 25 张、
# +ex_ins 解禁 14 张），训练起点 60 → 74（本刀把 allowed_ranks 从「过滤」改成「钳档」，
# 把 9 张只有 E/N 的卡纳了进来）。评测集这 10 张没动、尺子还是同一把，但训练分布变了，
# 直接拿后续实验跟 F 比会把「卡池」和「新机制」混在一起。
#
# 本条同时吃下两个不单独立项的改动（都属于「默认值升级」而非待验证假设）：
#   · 特征化 danger_topk_v3（敌人速度）—— 快速敌人撞自机的情形本就少，不值一条 2.5h；
#   · enemy_velocity 的瞬移守卫 —— 咲夜六张卡时停压平后 boss 每轮瞬移一次，不守会喂进离群速度。
#
# 判据：撑过率与方向/按键频率相对 F（撑过 0.938、方向 6.57/s）落在哪；卡池扩大后预期
# 撑过略降、泛化更好。这条的数字是 H（难度采样）与 I（自由躲弹）的比较基准。
[run]
total_updates = 2000
ckpt_every = 100
eval_every = 200

[env]
num_envs = 4096
threads = 63           # scripts/run-exp.sh 会按机器改写（EPYC 7742 → 32）

[reward.terms]
death = 10.0
follow_shaping = 1.0
hold = 0.01
segment_survived = 0.0
key_press = -0.003
shift_toggle = 0.0
edge_hug = 0.0
