notes = "小怪无敌（D8）。H/L 按 TH06 640 弹池等效截止：只跳过 Sub4/Sub7 扇形苦无（KUNAI, sprite 86）首次出现帧超过阈值的轮次（H: Sub4 ≥250；L: Sub4 ≥234、Sub7 ≥508），圆弹 ring / Sub8 / E–N 一律照原文；被截轮次仍 wait(2) 占时、f1 照常递增，故保留下来的轮次速度/时序与原作一致。原作靠 640 发弹池整批丢弃压画面（BulletManager.hpp:125），本引擎无此上限；截止规则按离线复现拟合（曲线误差 H 1.1% / L 2.9%）。Sub8 的 bullet_random 近似：随机速度逐颗 fire；flags 0x19 出生冲刺 + 永久 90° 重力用 xformdef 近似。"
